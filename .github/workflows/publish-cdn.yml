name: Publish CDN (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to deploy from
        default: main
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Deploy fixtures to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/fixtures
          clean: true
